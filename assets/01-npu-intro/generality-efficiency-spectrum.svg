<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="900" height="340" fill="#ffffff"/>

  <defs>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <text x="450" y="26" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">범용성 – 효율 스펙트럼</text>

  <!-- Top wedge: generality, high on the left, tapering to the right -->
  <polygon points="60,54 60,80 820,72 820,62" fill="#c7d2fe"/>
  <text x="70" y="47" font-size="13.5" fill="#4338ca">◀ 범용성 · 유연성 높음</text>
  <text x="830" y="70" font-size="13.5" fill="#4338ca" text-anchor="end">낮음</text>

  <!-- Bottom wedge: efficiency, low on the left, high on the right -->
  <polygon points="60,255 60,249 820,282 820,220" fill="#99f6e4"/>
  <text x="70" y="303" font-size="13.5" fill="#0f766e">낮음</text>
  <text x="830" y="240" font-size="13.5" fill="#0f766e" text-anchor="end">특화 효율 높음 (workload가 맞을 때) ▶</text>

  <!-- Main axis -->
  <line x1="60" y1="160" x2="820" y2="160" stroke="#64748b" stroke-width="2"/>

  <!-- Nodes -->
  <g>
    <circle cx="90" cy="160" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="280" cy="160" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="480" cy="160" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="660" cy="160" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="800" cy="160" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  </g>

  <!-- Labels below nodes -->
  <g font-size="15" fill="#1e293b" text-anchor="middle" font-weight="bold">
    <text x="90" y="195">CPU</text>
    <text x="280" y="195">GPU</text>
    <text x="480" y="195">GPU +</text>
    <text x="660" y="195">NPU /</text>
    <text x="800" y="195">고정 기능</text>
  </g>
  <g font-size="13" fill="#475569" text-anchor="middle">
    <text x="280" y="212">(SIMT)</text>
    <text x="480" y="212">Tensor Core</text>
    <text x="660" y="212">TPU</text>
    <text x="800" y="212">ASIC</text>
  </g>

  <text x="450" y="320" font-size="13" fill="#94a3b8" text-anchor="middle">현대 GPU와 NPU는 이 연속선 위에서 서로를 향해 다가서고 있습니다.</text>
</svg>
