<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>

  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/>
    </marker>
  </defs>

  <text x="450" y="28" font-size="17" font-weight="bold" fill="#1e293b" text-anchor="middle">NPU 코어의 다섯 블록</text>

  <!-- Legend -->
  <line x1="290" y1="46" x2="330" y2="46" stroke="#334155" stroke-width="2.5"/>
  <text x="338" y="50" font-size="12.5" fill="#475569">데이터 이동</text>
  <line x1="450" y1="46" x2="490" y2="46" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="498" y="50" font-size="12.5" fill="#854d0e">Control Unit 스케줄 신호</text>

  <!-- Control Unit -->
  <rect x="270" y="70" width="360" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="95" font-size="16" font-weight="bold" fill="#854d0e" text-anchor="middle">Control Unit</text>
  <text x="450" y="116" font-size="13" fill="#854d0e" text-anchor="middle">(컴파일러가 정한 순서대로 정적 스케줄링)</text>

  <!-- Off-chip DRAM/HBM -->
  <rect x="40" y="240" width="180" height="80" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="130" y="274" font-size="15" fill="#334155" text-anchor="middle">Off-chip</text>
  <text x="130" y="296" font-size="15" fill="#334155" text-anchor="middle">DRAM / HBM</text>

  <!-- DMA Engine -->
  <rect x="270" y="250" width="160" height="60" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="350" y="285" font-size="15" font-weight="bold" fill="#3730a3" text-anchor="middle">DMA Engine</text>

  <!-- SRAM / Scratchpad -->
  <rect x="480" y="240" width="180" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="570" y="274" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">SRAM /</text>
  <text x="570" y="296" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Scratchpad</text>

  <!-- Matrix Processor -->
  <rect x="430" y="390" width="180" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="520" y="420" font-size="15" font-weight="bold" fill="#7f1d1d" text-anchor="middle">Matrix Processor</text>
  <text x="520" y="442" font-size="13" fill="#7f1d1d" text-anchor="middle">(MAC 배열 · 행렬곱)</text>

  <!-- Vector Processor -->
  <rect x="650" y="390" width="190" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="745" y="420" font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">Vector Processor</text>
  <text x="745" y="442" font-size="13" fill="#14532d" text-anchor="middle">(정규화 · 활성화 함수)</text>

  <!-- Data flow: DRAM -> DMA -> SRAM -->
  <line x1="220" y1="280" x2="264" y2="280" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <line x1="430" y1="280" x2="474" y2="280" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

  <!-- Data flow: SRAM <-> Matrix / Vector Processor (read+write, reuse) -->
  <line x1="540" y1="320" x2="521" y2="386" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowSolid)" marker-start="url(#arrowSolid)"/>
  <line x1="610" y1="320" x2="720" y2="386" stroke="#334155" stroke-width="2.5" marker-end="url(#arrowSolid)" marker-start="url(#arrowSolid)"/>

  <!-- Control signals (dashed) -->
  <g stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)">
    <line x1="360" y1="130" x2="350" y2="246"/>
    <line x1="480" y1="130" x2="560" y2="236"/>
    <line x1="420" y1="130" x2="500" y2="386"/>
    <line x1="560" y1="130" x2="720" y2="386"/>
  </g>

  <!-- Caption -->
  <text x="450" y="500" font-size="15" fill="#334155" text-anchor="middle">실선: 데이터 이동 · 재사용 경로</text>
  <text x="450" y="522" font-size="15" fill="#854d0e" text-anchor="middle">점선: Control Unit이 컴파일 시점에 정한 스케줄 신호</text>
</svg>
